# SwiftLint config for AgentVFS
# No swiftlint_version pin — avoids version-mismatch warning across machines

included:
  - Sources
  - Tests

excluded:
  - .build

opt_in_rules:
  # Correctness / clarity
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_first_not_nil
  - sorted_first_last
  - toggle_bool
  - redundant_nil_coalescing
  - unused_optional_binding
  - joined_default_parameter
  - shorthand_optional_binding
  - legacy_multiple
  - prefer_zero_over_explicit_init
  - empty_collection_literal
  - fatal_error_message
  - optional_enum_case_matching
  - discouraged_optional_boolean
  - identical_operands
  - contains_over_range_nil_comparison
  - return_value_from_void_function
  - prefer_key_path
  - discouraged_none_name
  - discouraged_optional_collection
  - discouraged_assert
  - enum_case_associated_values_count
  - unavailable_function

  # Safety
  - weak_delegate
  - overridden_super_call
  - unowned_variable_capture
  - unhandled_throwing_task
  - optional_data_string_conversion
  - prohibited_super_call

  # Performance
  - reduce_into
  - flatmap_over_map_reduce

  # Style
  - closure_spacing
  - operator_usage_whitespace
  - explicit_init
  - vertical_whitespace_closing_braces
  - multiline_parameters
  - multiline_arguments
  - redundant_self
  - prefer_self_type_over_type_of_self
  - modifier_order
  - closure_end_indentation
  - vertical_parameter_alignment_on_call
  - pattern_matching_keywords
  - unneeded_parentheses_in_closure_argument
  - legacy_objc_type
  - file_name_no_space
  - prefer_self_in_static_references
  - trailing_closure
  - collection_alignment
  - multiline_literal_brackets
  - self_binding
  - direct_return
  - unneeded_override
  - yoda_condition
  - multiline_function_chains
  - period_spacing
  - comma_inheritance
  - implicit_return
  - strict_fileprivate
  - non_overridable_class_declaration

  # Tests
  - xct_specific_matcher
  - empty_xctest_method
  - single_test_class
  - test_case_accessibility
  - final_test_case

  # SwiftUI
  - private_swiftui_state
  - accessibility_label_for_image
  - accessibility_trait_for_button

  # Public API hygiene
  - missing_docs
  - force_unwrapping
  - implicitly_unwrapped_optional
  - file_header

  # Strict — enable later:
  # - convenience_type

implicitly_unwrapped_optional:
  mode: all_except_iboutlets

identifier_name:
  excluded:
    - id

type_name:
  excluded:
    - JQ

cyclomatic_complexity:
  # Exhaustive enum switches (1:1 mapping) are clear, not complex — don't let case
  # statements inflate the score. Genuinely branchy if/else/guard logic is still flagged.
  ignores_case_statements: true

file_header:
  required_pattern: |
    \/\/
    \/\/  .*?\.swift
    \/\/  .*
    \/\/
    \/\/  Created by Yevhenii Kalashnikov on \d{2}\.\d{2}\.\d{4}\.
    \/\/  Copyright © \d{4} Yevhenii Kalashnikov\. All rights reserved\.
    \/\/
